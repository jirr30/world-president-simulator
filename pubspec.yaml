name: world_president_simulator
description: Simulate being president of any country in the world
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI
  flutter_svg: ^2.0.10
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
